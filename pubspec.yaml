name: autosteering
description: Prototype program for automatically steering a tractor in a field.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
    sdk: ">=3.7.0 <4.0.0"
    flutter: 3.29.3

dependencies:
    archive: ^4.0.5
    async: ^2.12.0
    audioplayers: ^6.4.0
    collection: ^1.19.1
    cupertino_icons: ^1.0.8
    dio: ^5.8.0+1
    equatable: ^2.0.7
    fast_cached_network_image: ^1.3.3+5
    file_picker: ^10.1.2
    fl_chart: ^0.71.0
    flex_color_scheme: ^8.2.0
    flutter:
        sdk: flutter
    flutter_libserialport: ^0.5.0
    flutter_map: ^8.1.1
    flutter_riverpod: ^2.6.1
    flutter_shaders: ^0.1.3
    flutter_svg: ^2.1.0
    freezed_annotation: ^3.0.0
    # gamepads: ^0.1.5
    geobase: ^1.5.0
    geolocator: ^14.0.0
    google_fonts: ^6.2.1
    http: ^1.3.0
    intl: ^0.20.2
    json_annotation: ^4.9.0
    latlong2: ^0.9.1
    logger: ^2.5.0
    material_symbols_icons: ^4.2815.0
    nmea: ^3.3.2
    path: ^1.9.1
    path_provider: ^2.1.5
    permission_handler: ^12.0.0+1
    quiver: ^3.2.2
    riverpod_annotation: ^2.6.1
    themed: ^8.1.0
    udp: ^5.0.3
    universal_html: ^2.2.4
    universal_io: ^2.2.2
    # usb_serial: ^0.5.2
    uuid: ^4.5.1
    wakelock_plus: ^1.2.11
    window_manager: ^0.4.3
    xml: ^6.5.0

dependency_overrides:
    flutter_libserialport:
        git:
            url: https://github.com/jpnurmi/flutter_libserialport.git
            ref: 557d5d5865d073ed0532254243f396a6c2b0390b
    libserialport:
        git:
            url: https://github.com/jpnurmi/libserialport.dart
            ref: d591cb49b128a52f2e88a59da770ea2d73a0e570

    universal_io:
        git:
            url: https://github.com/dint-dev/universal_io.git
            ref: 41df5f997ffb8e177a06e1be2b539227dbc860ac

dev_dependencies:
    build_runner: ^2.4.15
    custom_lint: ^0.7.5
    flutter_test:
        sdk: flutter
    freezed: ^3.0.6
    json_serializable: ^6.9.5
    riverpod_generator: ^2.6.5
    riverpod_lint: ^2.6.5
    very_good_analysis: ^7.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
    # The following line ensures that the Material Icons font is
    # included with your application, so that you can use the icons in
    # the material Icons class.
    uses-material-design: true

    assets:
        - assets/
        - assets/audio/
        - assets/icons/
        - assets/images/
        - assets/images/vehicle_types/side_view/
        - assets/images/vehicle_types/top_view/
        - google_fonts/

    shaders:
        - assets/shaders/glow.frag
