name: autosteering
description: Prototype program for automatically steering a tractor in a field.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.2.0+1

environment:
    sdk: ">=3.10.0 <4.0.0"
    flutter: 3.38.6

dependencies:
    archive: ^4.0.7
    async: ^2.13.0
    audioplayers: ^6.5.1
    collection: ^1.19.1
    dio: ^5.9.0
    equatable: ^2.0.8
    fast_cached_network_image: ^1.3.3+5
    file_picker: ^10.3.8
    fl_chart: ^1.1.1
    flex_color_scheme: ^8.4.0
    flutter:
        sdk: flutter
    flutter_libserialport: ^0.6.0
    flutter_map: ^8.2.2
    flutter_riverpod: ^3.1.0
    flutter_shaders: ^0.1.3
    flutter_svg: ^2.2.3
    freezed_annotation: ^3.1.0
    # gamepads: ^0.1.9
    geobase: ^1.5.0
    geolocator: ^14.0.2
    google_fonts: ^7.0.0
    http: ^1.6.0
    intl: ^0.20.2
    json_annotation: ^4.9.0
    latlong2: ^0.9.1
    logger: ^2.6.2
    material_symbols_icons: ^4.2892.0
    nmea: ^3.3.3
    package_info_plus: ^9.0.0
    path: ^1.9.1
    path_provider: ^2.1.5
    permission_handler: ^12.0.1
    quiver: ^3.2.2
    riverpod_annotation: ^4.0.0
    themed: ^8.1.0
    udp: ^5.0.3
    universal_html: ^2.3.0
    universal_io: ^2.3.1
    uuid: ^4.5.2
    wakelock_plus: ^1.4.0
    window_manager: ^0.5.1
    xml: ^6.6.1

dev_dependencies:
    build_runner: ^2.10.4
    custom_lint: ^0.8.1
    flutter_test:
        sdk: flutter
    freezed: ^3.2.3
    json_serializable: ^6.11.2
    riverpod_generator: ^4.0.0+1
    riverpod_lint: ^3.1.0
    very_good_analysis: ^10.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
    # The following line ensures that the Material Icons font is
    # included with your application, so that you can use the icons in
    # the material Icons class.
    uses-material-design: true

    assets:
        - assets/
        - assets/audio/
        - assets/icons/
        - assets/images/
        - assets/images/vehicle_types/side_view/
        - assets/images/vehicle_types/top_view/
        - google_fonts/

    shaders:
        - assets/shaders/glow.frag
