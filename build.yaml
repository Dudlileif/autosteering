targets:
  $default:
    builders:
      drift_dev:
        options:
          schema_dir: drift_schemas/
          store_date_time_values_as_text: true
          databases:
            database: lib/src/features/database/models/database.dart
          sql:
            dialect: sqlite
            options:
              modules:
                - json1
                - fts5
        generate_for:
          include:
            - lib/**database/**.dart
          exclude:
            - lib/**.g.dart
            - lib/**.freezed.dart
      freezed:
        enabled: true
        generate_for:
          include:
            - lib/**models/**.dart
          exclude:
            - lib/**.g.dart
            - lib/**.freezed.dart
      json_serializable:
        enabled: true
        generate_for:
          include:
            - lib/**models/**.dart
          exclude:
            - lib/**.g.dart
            - lib/**.freezed.dart
      riverpod_generator:
        enabled: true
        generate_for:
          include:
            - lib/**providers/**.dart
          exclude:
            - lib/**.g.dart
            - lib/**.freezed.dart
